<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pagamento PIX - Loja de Apps</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
}


.container{
max-width:450px;
margin:50px auto;
background:#1e293b;
padding:30px;
border-radius:15px;
box-shadow:0 0 20px #000;
}


h1{
text-align:center;
color:#38bdf8;
}


.app{
background:#334155;
padding:15px;
border-radius:10px;
}


img{
width:100%;
height:250px;
object-fit:cover;
border-radius:15px;
}


.preco{
font-size:28px;
color:#22c55e;
font-weight:bold;
}


button{

width:100%;
padding:15px;
margin-top:15px;
border:0;
border-radius:10px;
font-size:18px;
cursor:pointer;

}


.pagar{

background:#009ee3;
color:white;

}


.copiar{

background:#22c55e;
color:white;

}


.info{

text-align:center;
margin-top:20px;
color:#94a3b8;

}


#pixArea{

display:none;
text-align:center;
margin-top:20px;

}


#qrCode{

width:220px;
height:220px;

}


</style>

</head>


<body>


<div class="container">


<h1>
🚀 Loja de Aplicativos
</h1>



<div class="app">


<img id="imagem" src="app.jpg">



<h2 id="nomeApp">
Carregando...
</h2>



<p id="descricao">
Carregando...
</p>



<div class="preco">

R$ <span id="preco">0</span>

</div>



</div>



<button class="pagar" onclick="pagar()">

📱 Gerar QR Code PIX

</button>



<div id="pixArea">


<h2>
Pagamento PIX
</h2>


<img id="qrCode">


<p id="codigoPix"></p>



<button class="copiar" onclick="copiarPix()">

📋 Copiar código PIX

</button>



</div>




<div class="info">

Pagamento seguro PIX

</div>



</div>






<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getDatabase,
ref,
onValue

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";




const firebaseConfig={


databaseURL:

"https://minha-loja-5477a-default-rtdb.europe-west1.firebasedatabase.app/"


};



const app=initializeApp(firebaseConfig);


const db=getDatabase(app);



const url=new URLSearchParams(window.location.search);


const id=url.get("id");



let produtoAtual;




onValue(ref(db,"produtos/"+id),(snapshot)=>{


const produto=snapshot.val();



if(produto){


produtoAtual=produto;



document.getElementById("nomeApp").innerHTML =
produto.nome || "Aplicativo";



document.getElementById("preco").innerHTML =
produto.preco || "0";



document.getElementById("imagem").src =
produto.imagem || "app.jpg";



document.getElementById("descricao").innerHTML =
produto.descricao || "Sem descrição";


}


});






window.pagar = async function(){


if(!produtoAtual){

alert("Produto não carregado");

return;

}




const resposta = await fetch("/criar-pix",{


method:"POST",


headers:{


"Content-Type":"application/json"


},


body:JSON.stringify({


produto:produtoAtual.nome,


preco:Number(produtoAtual.preco)


})


});




const dados = await resposta.json();




if(dados.qr_code_base64){



document.getElementById("pixArea").style.display="block";



document.getElementById("qrCode").src =

"data:image/png;base64," + dados.qr_code_base64;



document.getElementById("codigoPix").innerText =

dados.qr_code;



}else{


alert("Erro ao gerar PIX");


}



};







window.copiarPix=function(){



const codigo =
document.getElementById("codigoPix").innerText;



navigator.clipboard.writeText(codigo);



alert("✅ PIX copiado!");



};



</script>


</body>

</html>
