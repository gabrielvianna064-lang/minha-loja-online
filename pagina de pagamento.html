<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pagamento - Loja de Apps</title>


<style>

body{

    margin:0;
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;

}


.container{

    max-width:450px;
    margin:40px auto;
    background:#1e293b;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 20px #000;

}


h1{

    text-align:center;
    color:#38bdf8;

}


.produto{

    background:#334155;
    padding:15px;
    border-radius:12px;

}


#imagem{

    width:100%;
    height:230px;
    object-fit:cover;
    border-radius:12px;

}


.preco{

    font-size:30px;
    color:#22c55e;
    font-weight:bold;

}



button{

    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;

}



.mercado{

    background:#009ee3;
    color:white;

}



.pix{

    background:#22c55e;
    color:white;

}



.copiar{

    background:#475569;
    color:white;

}



#pixArea{

    display:none;
    text-align:center;
    margin-top:20px;

}



#qrCode{

    width:220px;
    height:220px;

}



.info{

    text-align:center;
    margin-top:20px;
    color:#94a3b8;

}


</style>


</head>


<body>


<div class="container">


<h1>
🚀 Pagamento
</h1>



<div class="produto">


<img id="imagem" src="app.jpg">



<h2 id="nome">

Carregando...

</h2>



<p id="descricao">

Carregando...

</p>



<div class="preco">

R$ <span id="preco">0</span>

</div>


</div>




<button class="mercado" onclick="mercadoPago()">

💳 Pagar Mercado Pago

</button>



<button class="pix" onclick="gerarPix()">

📱 Pagar com PIX QR Code

</button>




<div id="pixArea">


<h3>
Escaneie o QR Code
</h3>


<img id="qrCode">


<p id="codigoPix"></p>



<button class="copiar" onclick="copiarPix()">

📋 Copiar PIX

</button>


</div>



<div class="info">

Pagamento seguro Mercado Pago

</div>



</div>





<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getDatabase,
ref,
onValue

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";





const firebaseConfig={


databaseURL:

"https://minha-loja-5477a-default-rtdb.europe-west1.firebasedatabase.app/"


};



const app = initializeApp(firebaseConfig);


const db = getDatabase(app);



const params = new URLSearchParams(location.search);


const id = params.get("id");



let produtoAtual;





onValue(ref(db,"produtos/"+id),(snap)=>{


const produto=snap.val();



if(produto){


produtoAtual=produto;



document.getElementById("nome").innerHTML =
produto.nome;



document.getElementById("descricao").innerHTML =
produto.descricao || "Aplicativo";


document.getElementById("preco").innerHTML =
produto.preco;



document.getElementById("imagem").src =
produto.imagem || "app.jpg";


}


});







// Mercado Pago

window.mercadoPago = async()=>{


const resposta = await fetch("/criar-pagamento",{

method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

nome:produtoAtual.nome,

preco:Number(produtoAtual.preco)

})


});



const dados=await resposta.json();



if(dados.link){

location.href=dados.link;

}else{

alert("Erro Mercado Pago");

}


};








// PIX

window.gerarPix = async()=>{


const resposta=await fetch("/criar-pix",{

method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

nome:produtoAtual.nome,

preco:Number(produtoAtual.preco)

})


});



const dados=await resposta.json();



if(dados.qr_code_base64){



document.getElementById("pixArea").style.display="block";


document.getElementById("qrCode").src=

"data:image/png;base64,"+dados.qr_code_base64;



document.getElementById("codigoPix").innerHTML=

dados.qr_code;



}else{


alert("Erro ao gerar PIX");


}


};







window.copiarPix=()=>{


navigator.clipboard.writeText(

document.getElementById("codigoPix").innerHTML

);


alert("PIX copiado!");



};


</script>


</body>

</html>
