<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Conta Banida</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    background:linear-gradient(135deg,#8b0000,#1a0000);
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

}

.card{

    width:450px;
    max-width:95%;

    background:#fff;

    border-radius:25px;

    padding:35px;

    text-align:center;

    box-shadow:0 20px 60px rgba(0,0,0,.45);

}

.icone{

    font-size:90px;

    animation:pulsar 1.2s infinite;

}

@keyframes pulsar{

50%{

transform:scale(1.08);

}

}

h1{

margin-top:10px;

color:#c40000;

font-size:34px;

}

.status{

margin:20px 0;

padding:15px;

border-radius:12px;

background:#ffe7e7;

color:#b30000;

font-weight:bold;

}

.info{

text-align:left;

background:#f5f5f5;

padding:20px;

border-radius:15px;

margin-top:20px;

}

.info p{

margin:12px 0;

}

button{

margin-top:25px;

width:100%;

padding:15px;

border:none;

border-radius:12px;

background:#111;

color:white;

font-size:17px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#000;
transform:scale(1.03);

}

.rodape{

margin-top:20px;

font-size:13px;

color:#777;

}

</style>

</head>

<body>

<div class="card">

<div class="icone">🚫</div>

<h1>Conta Banida</h1>

<div class="status">

Seu acesso foi bloqueado pela Minha Loja.

</div>

<div class="info">

<p><b>👤 Usuário:</b> <span id="nome">Carregando...</span></p>

<p><b>📧 Email:</b> <span id="email">Carregando...</span></p>

<p><b>📌 Motivo:</b> <span id="motivo">Carregando...</span></p>

<p><b>⛔ Tipo:</b> <span id="tipo">Carregando...</span></p>

<p><b>📅 Data:</b> <span id="data">Carregando...</span></p>

</div>

<button onclick="location.href='index.html'">

Voltar

</button>

<div class="rodape">

Minha Loja © 2026

</div>

</div>

<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue
} 
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";


/*=========================
 FIREBASE
=========================*/

const firebaseConfig = {

    databaseURL:
    "https://minha-loja-5477a-default-rtdb.europe-west1.firebasedatabase.app"

};


const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


/*=========================
 RECEBER TODO FIREBASE
=========================*/

onValue(ref(db), (snapshot)=>{


    const todosDados = snapshot.val();


    console.log("TODOS OS DADOS DO FIREBASE:");
    console.log(todosDados);



    // Mostrar na tela

    document.getElementById("dados").textContent =
    JSON.stringify(
        todosDados,
        null,
        2
    );


});

</script>


<pre id="dados">
Carregando dados...
</pre>
