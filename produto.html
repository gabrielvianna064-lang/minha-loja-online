<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Produto Aplicativo 3</title>

<style>

body{
font-family:Arial, sans-serif;
background:#f4f4f4;
margin:0;
}

header{
background:#111;
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:900px;
margin:30px auto;
background:white;
padding:30px;
border-radius:15px;
}

.produto{
display:flex;
gap:30px;
flex-wrap:wrap;
}

.imagem img{
width:300px;
height:300px;
object-fit:cover;
border-radius:20px;
}

.info{
flex:1;
}

h1{
font-size:32px;
}

.preco{
font-size:30px;
color:#009900;
font-weight:bold;
margin:20px 0;
}

.descricao{
margin-top:30px;
background:#eee;
padding:20px;
border-radius:15px;
}

.descricao h2{
margin-top:0;
}

.descricao p{
font-size:18px;
line-height:1.6;
}

button{
width:100%;
padding:15px;
border:0;
border-radius:10px;
font-size:18px;
cursor:pointer;
margin-top:10px;
}

.voltar{
background:#111;
color:white;
}

.compartilhar{
background:#777;
color:white;
}

.comprar{
background:#00a650;
color:white;
}

.carrinho{
background:#3483fa;
color:white;
}

</style>

</head>


<body>


<header>

<h2>📱 Minha Loja de Aplicativos</h2>

</header>



<div class="container">


<div class="produto">


<div class="imagem">

<img id="imagem" src="app.jpg">

</div>



<div class="info">


<h1 id="nome">

Carregando...

</h1>



<div class="preco">

R$ <span id="preco"></span>

</div>



<button class="voltar" onclick="voltar()">

⬅️ Voltar

</button>



<button class="compartilhar" onclick="compartilharProduto()">

🔗 Compartilhar Produto

</button>



<button class="comprar" onclick="comprar()">

💰 Comprar agora

</button>



<button class="carrinho" onclick="carrinho()">

🛒 Adicionar ao carrinho

</button>



</div>


</div>





<div class="descricao">


<h2>

📄 Descrição do produto

</h2>



<p id="descricao">

Carregando descrição...

</p>


</div>



</div>






<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getDatabase,
ref,
onValue,
push,
set

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";





const firebaseConfig = {


databaseURL:

"https://minha-loja-5477a-default-rtdb.europe-west1.firebasedatabase.app/"


};



const app = initializeApp(firebaseConfig);


const db = getDatabase(app);





const url = new URLSearchParams(window.location.search);


const id = url.get("id");



let produtoAtual;





onValue(ref(db,"produtos/"+id),(snapshot)=>{


const produto = snapshot.val();



if(produto){



produtoAtual = produto;



document.getElementById("nome").innerHTML =

produto.nome || "Aplicativo";




document.getElementById("preco").innerHTML =

produto.preco || "0";




document.getElementById("imagem").src =

produto.imagem || "app.jpg";




document.getElementById("descricao").innerHTML =

produto.descricao || "Sem descrição disponível.";



}



});





window.voltar=function(){

history.back();

};







window.comprar=function(){



if(!produtoAtual){


alert("Produto carregando...");


return;


}



window.location.href =

"pagina de pagamento.html?id="+id;



};








window.carrinho=function(){



if(!produtoAtual){


alert("Produto carregando...");


return;


}




const produto = {



id:id,


nome:produtoAtual.nome,


preco:Number(produtoAtual.preco),


imagem:produtoAtual.imagem,


descricao:produtoAtual.descricao || "",


data:Date.now()



};






const novo = push(

ref(db,"carrinhos/cliente1")

);





set(novo,produto);



alert("✅ Aplicativo adicionado ao carrinho!");



};









window.compartilharProduto = async function(){



const link = window.location.href;



const nome = document.getElementById("nome").innerText;





const mensagem =



"📱 Minha Loja de Aplicativos\n\n"+


"🔥 Confira este produto:\n\n"+


"📦 "+nome+



"\n\nVeja aqui:\n"+



link;





if(navigator.share){



try{



await navigator.share({


title:nome,


text:mensagem,


url:link



});



}catch(e){}





}else{



navigator.clipboard.writeText(mensagem);


alert("✅ Link copiado!");



}



};





</script>


</body>

</html>
