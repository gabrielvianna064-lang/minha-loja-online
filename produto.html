<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Produto Aplicativo</title>


<style>

*{
box-sizing:border-box;
}


body{

font-family:Arial,sans-serif;
background:#f1f5f9;
margin:0;

}



header{

background:#111827;
color:white;
padding:25px;
text-align:center;

}



.container{

max-width:950px;
margin:30px auto;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 5px 20px #0003;

}



.produto{

display:flex;
gap:35px;
flex-wrap:wrap;

}



.imagem img{

width:300px;
height:300px;
object-fit:cover;
border-radius:25px;

}



.info{

flex:1;

}



h1{

font-size:35px;

}



.preco{

font-size:32px;
font-weight:bold;
color:#16a34a;
margin:20px 0;

}



button{

width:100%;
padding:15px;
border:0;
border-radius:12px;
font-size:18px;
cursor:pointer;
margin-top:12px;
transition:.3s;

}



button:hover{

transform:scale(1.03);

}



.voltar{

background:#111827;
color:white;

}



.comprar{

background:#16a34a;
color:white;

}



.carrinho{

background:#2563eb;
color:white;

}



.compartilhar{

background:#7c3aed;
color:white;

}



.avaliar{

background:#f59e0b;
color:white;

}





.descricao{

margin-top:35px;
background:#f8fafc;
padding:25px;
border-radius:20px;

}



.descricao p{

font-size:18px;
line-height:1.7;

}



video{

border-radius:15px;
margin-top:15px;

}




#listaAvaliacoes{

margin-top:20px;

}



.avaliacao{

background:white;
padding:20px;
border-radius:15px;
margin-top:15px;
box-shadow:0 3px 10px #0002;

}



.avaliacao h3{

margin:0;
color:#f59e0b;

}




@media(max-width:700px){

.imagem img{

width:100%;
height:auto;

}


.container{

margin:10px;
padding:20px;

}


}


</style>


</head>



<body>



<header>

<h2>
📱 Minha Loja de Aplicativos
</h2>

</header>




<div class="container">


<div class="produto">



<div class="imagem">

<img id="imagem" src="app.jpg">

</div>





<div class="info">


<h1 id="nome">

Carregando...

</h1>




<div class="preco">

R$ <span id="preco"></span>

</div>





<button class="voltar" onclick="voltar()">

⬅️ Voltar

</button>




<button class="comprar" onclick="comprar()">

💰 Comprar agora

</button>





<button class="carrinho" onclick="carrinho()">

🛒 Adicionar ao carrinho

</button>





<button class="compartilhar" onclick="compartilharProduto()">

📤 Compartilhar Produto

</button>





<button class="avaliar" onclick="avaliarProduto()">

⭐ Avaliar Produto

</button>



</div>


</div>





<div class="descricao">


<h2>
📄 Descrição do produto
</h2>


<p id="descricao">

Carregando descrição...

</p>





<h2>
🎥 Vídeo de Demonstração
</h2>




<video width="100%" controls>


<source src="demo.mp4" type="video/mp4">


Seu navegador não suporta vídeos.


</video>





<h2>
⭐ Avaliações dos clientes
</h2>




<div id="listaAvaliacoes">

Carregando avaliações...

</div>




</div>


</div>

<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getDatabase,
ref,
onValue,
push,
set

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";





const firebaseConfig = {

databaseURL:
"https://minha-loja-5477a-default-rtdb.europe-west1.firebasedatabase.app/"

};





const app = initializeApp(firebaseConfig);


const db = getDatabase(app);





const url = new URLSearchParams(window.location.search);


const id = url.get("id");



let produtoAtual = null;





// ===============================
// CARREGAR PRODUTO
// ===============================


onValue(ref(db,"produtos/"+id),(snapshot)=>{


const produto = snapshot.val();



if(produto){



produtoAtual = produto;



document.getElementById("nome").innerHTML =
produto.nome || "Aplicativo";



document.getElementById("preco").innerHTML =
produto.preco || "0";



document.getElementById("imagem").src =
produto.imagem || "app.jpg";



document.getElementById("descricao").innerHTML =
produto.descricao || "Sem descrição disponível.";



}


});








// ===============================
// VOLTAR
// ===============================


window.voltar=function(){

history.back();

};








// ===============================
// COMPRAR
// ===============================


window.comprar=function(){


if(!produtoAtual){

alert("Produto carregando...");

return;

}



window.location.href =
"pagina de pagamento.html?id="+id;



};








// ===============================
// CARRINHO
// ===============================


window.carrinho=function(){


if(!produtoAtual){

alert("Produto carregando...");

return;

}



const produto = {


id:id,


nome:produtoAtual.nome,


preco:Number(produtoAtual.preco),


imagem:produtoAtual.imagem || "",


descricao:produtoAtual.descricao || "",


data:Date.now()


};





const novo = push(

ref(db,"carrinhos/cliente1")

);



set(novo,produto)

.then(()=>{


alert("✅ Aplicativo adicionado ao carrinho!");


})

.catch((erro)=>{


alert("Erro: "+erro);


});



};










// ===============================
// COMPARTILHAR
// ===============================


window.compartilharProduto=function(){



const titulo =
document.getElementById("nome").innerText;



const texto =
"Confira este aplicativo na Minha Loja de Aplicativos!";



const link =
window.location.href;





if(navigator.share){


navigator.share({

title:titulo,

text:texto,

url:link

});



}else{


navigator.clipboard.writeText(link);



alert("✅ Link copiado!");



}



};










// ===============================
// IR PARA AVALIAÇÃO
// ===============================


window.avaliarProduto=function(){


window.location.href =
"avaliacao.html?id="+id;


};









// ===============================
// MOSTRAR AVALIAÇÕES
// ===============================


onValue(ref(db,"avaliacoes/"+id),(snapshot)=>{


const lista =
document.getElementById("listaAvaliacoes");



if(!lista) return;




lista.innerHTML="";





if(!snapshot.exists()){


lista.innerHTML =
"Este produto ainda não possui avaliações.";


return;


}






snapshot.forEach((item)=>{



const dados=item.val();





lista.innerHTML += `


<div class="avaliacao">


<h3>

${"⭐".repeat(Number(dados.nota || 0))}

</h3>



<p>

${dados.comentario || "Sem comentário"}

</p>



</div>


`;



});



});





</script>


</body>


</html>
